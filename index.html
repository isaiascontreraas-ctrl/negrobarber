<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Negro Barber Gestión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: header con marca + selector de mes, tabs por rol, contenido en tarjetas; mobile-first */
:root{
  --bg:#F3F1EE; --surface:#FFFFFF; --ink:#1B1A19; --muted:#6B6661; --line:#E0DBD5;
  --accent:#B3172B; --accent-ink:#FFFFFF; --soft:#F8E8EA;
  --good:#1D7A4C; --warn:#9A6200; --bad:#B3172B;
  --display:"Anton", Impact, "Arial Narrow", sans-serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141312; --surface:#1E1C1B; --ink:#F1EEEA; --muted:#A39D97; --line:#33302D;
    --accent:#E2485C; --accent-ink:#140405; --soft:#3A1C21;
    --good:#4CC28A; --warn:#E3A93A; --bad:#FF6B7D; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141312; --surface:#1E1C1B; --ink:#F1EEEA; --muted:#A39D97; --line:#33302D;
  --accent:#E2485C; --accent-ink:#140405; --soft:#3A1C21;
  --good:#4CC28A; --warn:#E3A93A; --bad:#FF6B7D; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:24px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.brand span{color:var(--accent)}
.pole{width:10px;height:28px;border-radius:5px;background:repeating-linear-gradient(-45deg,var(--accent) 0 5px,var(--surface) 5px 10px,#2B4C9A 10px 15px,var(--surface) 15px 20px);border:1px solid var(--line)}
.who{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;white-space:nowrap}
.chip.ok{color:var(--good);border-color:currentColor}
.chip.warn{color:var(--warn);border-color:currentColor}
.chip.bad{color:var(--bad);border-color:currentColor}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 12px}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 10px 9px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:16px;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;min-width:0}
.card h2{font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.03em;text-transform:uppercase;margin:0;text-wrap:balance}
.card h3{margin:0;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:2px}
.kpi .l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi .v{font-family:var(--display);font-size:30px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.kpi .s{font-size:13px;color:var(--muted)}
.kpi.hi{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.neg{color:var(--bad)} .pos{color:var(--good)}
label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--ink)}
.btn.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.s{padding:4px 9px;font-size:13px;font-weight:500}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pick{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;cursor:pointer;font-weight:500}
.pick.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pick small{opacity:.7;margin-left:4px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink)}
.check input{width:auto}
.prev{display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px 12px;border-radius:8px;background:var(--soft);font-size:14px;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding:6px 8px;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap}
tr.tot td{font-weight:700;border-bottom:0}
tr.day td{background:var(--bg);font-weight:600;font-size:13px;color:var(--muted)}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:110px 1fr 90px;gap:8px;align-items:center;font-size:13px}
.bar .t{height:12px;background:var(--bg);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar .t i{display:block;height:100%;background:var(--accent)}
.bar .t i.g{background:var(--muted)}
.bar .n{text-align:right;font-variant-numeric:tabular-nums}
.cols{display:flex;align-items:flex-end;gap:3px;height:140px;padding-top:8px;border-bottom:1px solid var(--line);position:relative}
.cols div{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:1px;position:relative}
.cols div.z{background:var(--line)}
.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.banner{padding:10px 14px;border-radius:8px;border:1px solid var(--warn);color:var(--warn);background:var(--surface);font-size:14px}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:14px}
.wk{display:flex;align-items:center;gap:8px}
.wk b{font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;display:none;z-index:20;max-width:90vw}
.cfgt input,.cfgt select{padding:6px 8px}
.cfgt td{padding:4px}
.lbl{font-size:13px;color:var(--muted);font-weight:500;margin-bottom:6px}
.qf{display:grid;gap:14px}
.chips.big .pick{padding:12px 16px;font-size:16px;border-radius:10px}
.btn.xl{padding:14px 18px;font-size:17px;width:100%}
.btn.xl:disabled{opacity:.5;cursor:not-allowed}
.amt{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;max-width:260px}
details>summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;list-style:none}
details>summary::before{content:"+ "}
details[open]>summary::before{content:"− "}
.by{font-size:12px;color:var(--muted);white-space:nowrap}
#toast button{margin-left:10px;background:none;border:1px solid currentColor;color:inherit;border-radius:6px;padding:2px 8px;cursor:pointer;font-weight:600}
@media (max-width:520px){ .bar{grid-template-columns:80px 1fr 80px} .kpi .v{font-size:26px} }
@media (prefers-reduced-motion:no-preference){ .bar .t i{transition:width .3s} }
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="pole" aria-hidden="true"></div>
    <div class="brand" id="brand">Negro <span>Barber</span></div>
    <div class="who" id="who"><span class="chip">Cargando…</span></div>
  </div>
  <nav id="nav"></nav>
</header>
<main id="view"><div class="card"><div class="empty">Cargando datos…</div></div></main>
<div id="toast" role="status"></div>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,sendPasswordResetEmail,createUserWithEmailAndPassword} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,setDoc,addDoc,deleteDoc,onSnapshot,query,where,orderBy,limit} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const firebaseConfig={apiKey:"AIzaSyB1nmVFvYFCJS0iJEqkE388B2HblbjLYyQ",authDomain:"barber-4f30a.firebaseapp.com",projectId:"barber-4f30a",storageBucket:"barber-4f30a.firebasestorage.app",messagingSenderId:"435949254109",appId:"1:435949254109:web:7da2ed1f9fddc0ac68b234"};
const ADMIN_EMAIL='isaiascontreraas@gmail.com';
const fbApp=initializeApp(firebaseConfig);
const auth=getAuth(fbApp);
let fdb;try{fdb=initializeFirestore(fbApp,{ignoreUndefinedProperties:true,localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(e){fdb=initializeFirestore(fbApp,{ignoreUndefinedProperties:true})}
/* ===================== utilidades ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(n<0?'-$':'$')+Math.round(Math.abs(n||0)).toLocaleString('es-AR');
const pctf=n=>(Math.round((n||0)*1000)/10).toLocaleString('es-AR')+'%';
const num=v=>{const x=parseFloat(String(v??'').replace(',','.'));return isNaN(x)?0:x};
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ds(new Date());
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const monday=s=>{const d=pd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ds(d)};
const mStart=m=>m+'-01';
const mEnd=m=>{const[y,mm]=m.split('-').map(Number);return ds(new Date(y,mm,0))};
const fmtD=s=>s?s.slice(8,10)+'/'+s.slice(5,7):'';
const mesLabel=m=>{const[y,mm]=m.split('-').map(Number);const t=new Date(y,mm-1,1).toLocaleDateString('es-AR',{month:'long',year:'numeric'});return t[0].toUpperCase()+t.slice(1)};
const dayName=s=>pd(s).toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'numeric'});
const sum=(a,f)=>a.reduce((t,x)=>t+(f(x)||0),0);
const norm=s=>String(s||'').trim().toLowerCase();
function toast(m,act,fn){const t=$('#toast');t.textContent=m;if(act){const b=document.createElement('button');b.textContent=act;b.onclick=()=>{t.style.display='none';fn()};t.appendChild(b)}
  t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',act?6000:2600)}
const pickBtn=(val,on,small)=>`<button type="button" class="pick ${on?'on':''}" data-val="${esc(val)}">${esc(val)}${small?`<small>${small}</small>`:''}</button>`;
const byCell=d=>d&&d.by?`<span class="by"><span data-uid="${esc(d.by)}">…</span>${d.editBy?' · editado':''}</span>`:'<span class="by">—</span>';

/* ===================== estado ===================== */
const S={
  mode:'loading', db:null, user:null, uid:null, isOwner:false,
  role:null, myPel:null, solicitado:false,
  cfg:null, cfgLoaded:false,
  ventas:[], egresos:[], cierres:[], abonos:[], abonoCortes:[], saldos:null, miembros:[], solicitudes:[],
  tab:null, wkVals:{}, semanas:{}, nombres:{}, mes:today().slice(0,7), semana:monday(today()), cajaFecha:today(),
  filtroPel:'', editVenta:null, editEgreso:null, draft:null, offline:false
};
const DEFAULT_CFG={
  negocio:'Negro Barber', dueno:'Matias', abonoCorte:'Corte (abono)',
  peluqueros:[{nombre:'Matias',pct:.5},{nombre:'Bruno',pct:.5},{nombre:'Isaias',pct:.4}],
  catalogo:[
    {concepto:'Corte',tipo:'Servicio',precio:15000,base:null,costo:0,comisiona:true},
    {concepto:'Corte y barba',tipo:'Servicio',precio:17000,base:null,costo:0,comisiona:true},
    {concepto:'Abono mensual (4 cortes)',tipo:'Abono',precio:45000,base:0,costo:0,comisiona:false},
    {concepto:'Corte (abono)',tipo:'Servicio',precio:0,base:11250,costo:0,comisiona:true},
    {concepto:'Cera',tipo:'Producto',precio:10000,base:0,costo:5000,comisiona:false}],
  medios:[{medio:'Efectivo',pct:0,cuenta:'Caja efectivo'},{medio:'Transferencia',pct:0,cuenta:'Banco'},
    {medio:'Mercado Pago',pct:.05,cuenta:'Mercado Pago'},{medio:'Débito',pct:.05,cuenta:'Mercado Pago'},{medio:'Crédito',pct:.05,cuenta:'Mercado Pago'}],
  cuentas:['Caja efectivo','Banco','Mercado Pago'],
  gastos:[{concepto:'Alquiler',presupuesto:700000},{concepto:'Luz',presupuesto:50000},{concepto:'Agua',presupuesto:30000},
    {concepto:'Internet',presupuesto:35000},{concepto:'Monotributo',presupuesto:60000},{concepto:'IIBB / Tasa municipal',presupuesto:60000},
    {concepto:'Contador',presupuesto:30000},{concepto:'Insumos',presupuesto:95000},{concepto:'Otros',presupuesto:0}]
};
const C=()=>S.cfg||DEFAULT_CFG;
const cat=n=>C().catalogo.find(x=>x.concepto===n);
const pelOf=n=>C().peluqueros.find(x=>x.nombre===n);
const medioOf=n=>C().medios.find(x=>x.medio===n);
const cajaEf=()=>C().cuentas[0]||'Caja efectivo';
const isAdmin=()=>S.role==='admin'||S.role==='dueno';
const semCerrada=l=>!!(l&&S.semanas&&S.semanas[l]&&S.semanas[l].estado==='cerrada');
const lockedV=v=>semCerrada(v.semana||monday(v.fecha));
const lockedE=e=>semCerrada(monday(e.fecha))||semCerrada(e.semana);
const lockMsg=f=>'La semana del '+fmtD(monday(f))+' está cerrada. Solo el administrador puede reabrirla.';

/* ===================== almacenamiento (Firebase) ===================== */
function onErr(e){console.warn(e);if(e&&e.code==='permission-denied')toast('No tenés permiso para ver algunos datos.');}
const snapList=s=>s.docs.map(d=>({id:d.id,...d.data()}));
const noPrev=()=>{if(S.preview)throw {code:'preview'}};
async function put(coll,id,data){noPrev();await setDoc(doc(fdb,coll,id),data);return id}
async function add(coll,data){noPrev();const r=await addDoc(collection(fdb,coll),data);return r.id}
async function del(coll,id){noPrev();await deleteDoc(doc(fdb,coll,id))}
async function safe(p,ok){try{await p;if(ok)toast(ok);return true}catch(e){console.warn(e);
  toast(e&&e.code==='preview'?'Estás en vista previa: los cambios están desactivados.':e&&e.code==='permission-denied'?'No tenés permiso para hacer esto.':e&&e.code==='resource-exhausted'?'Se alcanzó el límite diario gratuito. Probá mañana.':'No se pudo guardar. Revisá la conexión y probá de nuevo.');return false}}

const me=()=>S.uid||'';
const nowIso=()=>new Date().toISOString();
async function logA(accion,coll,id,desc){try{await add('log',{accion,coll,docId:id||'',desc:desc||'',by:me(),ts:nowIso()})}catch(e){}}
const descV=v=>`${v.concepto} · ${v.peluquero} · ${money(calc(v).total)} · ${v.medio}`;
const descE=e=>`${e.tipo}${e.concepto?' '+e.concepto:''}${e.peluquero?' '+e.peluquero:''}${e.destino&&e.tipo==='Movimiento entre cuentas'?' → '+e.destino:''} · ${money(num(e.monto))} · ${e.cuenta}`;
function subLog(){return onSnapshot(query(collection(fdb,'log'),orderBy('ts','desc'),limit(150)),s=>{S.log=snapList(s);live()},onErr)}

/* ===================== suscripciones ===================== */
const U={};
function stop(k){if(U[k]){U[k]();delete U[k]}}
function stopAll(keep){Object.keys(U).forEach(k=>{if(!keep||!keep.includes(k))stop(k)})}
const isGest=()=>S.role==='admin'||S.role==='dueno';
let rangeKey='';
function ultimoCierre(){return Object.values(S.semanas||{}).filter(d=>d.estado==='cerrada'&&d.saldos).sort((x,y)=>(x.lunes||x.id)<(y.lunes||y.id)?1:-1)[0]||null}
function saldosActuales(){
  const lc=ultimoCierre();if(!lc)return null;const desde=addD(lc.lunes||lc.id,7),hoy=today();
  const vs=S.ventas.filter(v=>v.fecha>=desde&&v.fecha<=hoy),es=S.egresos.filter(e=>e.fecha>=desde&&e.fecha<=hoy);
  return {desde,lc,rows:C().cuentas.map(k=>{const base=num(lc.saldos[k]&&lc.saldos[k].real);
    const t=base+sum(vs.filter(v=>v.cuenta===k),v=>calc(v).entra)+sum(es.filter(e=>e.tipo==='Movimiento entre cuentas'&&e.destino===k),e=>num(e.monto))-sum(es.filter(e=>e.cuenta===k),e=>num(e.monto));
    return [k,t]})};
}
function range(){
  const lc=ultimoCierre();const a=[mStart(S.mes),S.semana,S.cajaFecha].concat(lc?[addD(lc.lunes||lc.id,7)]:[]).sort()[0];
  const b=[mEnd(S.mes),addD(S.semana,6),S.cajaFecha].sort().pop();
  return [a,b];
}
function mergeV(){const m=new Map();for(const k of['q1','q2','q3'])(S._v[k]||[]).forEach(v=>m.set(v.id,v));S.ventas=[...m.values()];live()}
function mergeE(){const m=new Map();for(const k of['e1','e2'])(S._e[k]||[]).forEach(v=>m.set(v.id,v));S.egresos=[...m.values()];live()}
function resubRange(){
  if(S.role==='peluquero'){
    const k='p'+S.semana+today();if(k===rangeKey)return;rangeKey=k;
    S._v={};S._e={};
    stop('q1');stop('q2');stop('e1');stop('e2');
    U.q1=onSnapshot(query(collection(fdb,'ventas'),where('peluquero','==',S.myPel||'-'),where('semana','==',S.semana)),s=>{S._v.q1=snapList(s);mergeV()},onErr);
    U.q2=onSnapshot(query(collection(fdb,'ventas'),where('fecha','==',today())),s=>{S._v.q2=snapList(s);mergeV()},onErr);
    U.e1=onSnapshot(query(collection(fdb,'egresos'),where('peluquero','==',S.myPel||'-'),where('semana','==',S.semana)),s=>{S._e.e1=snapList(s);mergeE()},onErr);
    U.e2=onSnapshot(query(collection(fdb,'egresos'),where('fecha','==',today())),s=>{S._e.e2=snapList(s);mergeE()},onErr);
    return;
  }
  if(!isGest())return;
  const [a,b]=range();const k=a+b;if(k===rangeKey)return;rangeKey=k;
  stop('v');stop('e');
  U.v=onSnapshot(query(collection(fdb,'ventas'),where('fecha','>=',a),where('fecha','<=',b)),s=>{S.ventas=snapList(s);live()},onErr);
  S._e={};
  U.e=onSnapshot(query(collection(fdb,'egresos'),where('fecha','>=',a),where('fecha','<=',b)),s=>{S._e.r=snapList(s);mergeEG()},onErr);
  stop('es');U.es=onSnapshot(query(collection(fdb,'egresos'),where('semana','==',S.semana)),s=>{S._e.w=snapList(s);mergeEG()},onErr);
}
function mergeEG(){const m=new Map();for(const k of['r','w'])(S._e[k]||[]).forEach(v=>m.set(v.id,v));S.egresos=[...m.values()];live()}
function resubSaldos(){if(!isGest())return;stop('s');U.s=onSnapshot(doc(fdb,'saldos',S.mes),d=>{S.saldos=d.exists()?d.data():null;live()},onErr)}
function startData(){
  stopAll(['me']);rangeKey='';S.cfgLoaded=false;S.ventas=[];S.egresos=[];
  const t=setTimeout(()=>{if(!S.cfgLoaded){S.offline=true;render()}},10000);
  U.cfg=onSnapshot(doc(fdb,'config','main'),d=>{S.cfg=d.exists()?clean(d.data()):null;S.cfgLoaded=true;S.offline=false;clearTimeout(t);render()},e=>{onErr(e);S.cfgLoaded=true;clearTimeout(t);render()});
  resubRange();resubSaldos();
  U.c=onSnapshot(query(collection(fdb,'cierres'),orderBy('fecha','desc'),limit(60)),s=>{S.cierres=snapList(s).reverse();live()},onErr);
  U.a=onSnapshot(collection(fdb,'abonos'),s=>{S.abonos=snapList(s);live()},onErr);
  U.ac=onSnapshot(query(collection(fdb,'ventas'),where('abonoCorte','==',true)),s=>{S.abonoCortes=snapList(s);if(S.role==='peluquero'){S._v.q3=S.abonoCortes;mergeV()}else live()},onErr);
  U.sm=onSnapshot(collection(fdb,'semanas'),s=>{S.semanas={};snapList(s).forEach(d=>S.semanas[d.id]=d);if(isGest())resubRange();live()},onErr);
  if(isGest())U.nm=onSnapshot(collection(fdb,'nombres'),s=>{S.nombres={};snapList(s).forEach(d=>S.nombres[d.id]=d.nombre);live();syncNombres()},onErr);
  if(S.role==='admin')U.us=onSnapshot(collection(fdb,'usuarios'),s=>{S.usuarios=snapList(s);syncNombres();if(S.tab==='config'){if(S.draft&&document.getElementById('cfNeg'))readDraft();render()}else live()},onErr);
}
function clean(d){const o=JSON.parse(JSON.stringify(d));delete o.id;
  for(const k of['peluqueros','catalogo','medios','cuentas','gastos'])if(!Array.isArray(o[k]))o[k]=[];return o}

/* ===================== cálculo ===================== */
function snap(f){
  const it=cat(f.concepto)||{},pe=pelOf(f.peluquero)||{},me=medioOf(f.medio)||{};
  return {...f,tipo:it.tipo||'Servicio',precio:num(it.precio),
    base:(it.base===null||it.base===undefined||it.base==='')?num(it.precio):num(it.base),
    costo:num(it.costo),comisiona:!!it.comisiona,pct:num(pe.pct),feePct:num(me.pct),cuenta:me.cuenta||'',semana:monday(f.fecha),abonoCorte:f.concepto===C().abonoCorte};
}
function calc(v){
  const cant=num(v.cant)||1,dto=num(v.dto),prop=num(v.propina);
  const lista=num(v.precio)*cant,total=lista-dto;
  const com=v.comisiona?Math.max(0,num(v.base)*cant-(v.dtoDueno===false?dto:0))*num(v.pct):0;
  const fee=(total+prop)*num(v.feePct),costo=num(v.costo)*cant;
  return {cant,dto,prop,lista,total,com,fee,costo,neto:total-com-fee-costo,entra:total+prop-fee,cortes:v.tipo==='Servicio'?cant:0};
}
const vMes=()=>S.ventas.filter(v=>v.fecha&&v.fecha.startsWith(S.mes));
const eMes=()=>S.egresos.filter(e=>e.fecha&&e.fecha.startsWith(S.mes));
const vSem=(sem)=>S.ventas.filter(v=>v.fecha&&monday(v.fecha)===sem);
const eSem=(sem)=>S.egresos.filter(e=>(e.semana||monday(e.fecha))===sem);

function resumen(){
  const vs=vMes().map(v=>({v,c:calc(v)})),es=eMes();
  const by=t=>sum(vs.filter(x=>x.v.tipo===t),x=>x.c.total);
  const r={serv:by('Servicio'),abono:by('Abono'),prod:by('Producto')};
  r.total=r.serv+r.abono+r.prod; r.dto=sum(vs,x=>x.c.dto); r.cortes=sum(vs,x=>x.c.cortes);
  r.ticket=r.cortes?(r.serv+r.abono)/r.cortes:0;
  r.fact=r.total?sum(vs.filter(x=>x.v.facturado),x=>x.c.total)/r.total:0;
  r.com=sum(vs,x=>x.c.com); r.fee=sum(vs,x=>x.c.fee); r.costo=sum(vs,x=>x.c.costo);
  r.gastos=sum(es.filter(e=>e.tipo==='Gasto'),e=>num(e.monto));
  r.costos=r.com+r.fee+r.costo+r.gastos; r.gan=r.total-r.costos; r.margen=r.total?r.gan/r.total:0;
  r.presu=sum(C().gastos,g=>num(g.presupuesto));
  r.ganPresu=r.total-r.com-r.fee-r.costo-Math.max(r.presu,r.gastos);
  r.comDueno=sum(vs.filter(x=>x.v.peluquero===C().dueno),x=>x.c.com);
  r.dueno=r.comDueno+r.gan; r.retiros=sum(es.filter(e=>e.tipo==='Retiro dueño'),e=>num(e.monto));
  r.vs=vs; r.es=es; return r;
}
function liquidacion(sem,soloPel){
  const vs=vSem(sem),es=eSem(sem);
  return C().peluqueros.filter(p=>!soloPel||p.nombre===soloPel).map(p=>{
    const mine=vs.filter(v=>v.peluquero===p.nombre).map(calc);
    const o={nombre:p.nombre,cortes:sum(mine,c=>c.cortes),fact:sum(mine,c=>c.total),com:sum(mine,c=>c.com),prop:sum(mine,c=>c.prop)};
    o.ganado=o.com+o.prop;
    o.adel=sum(es.filter(e=>e.tipo==='Adelanto'&&e.peluquero===p.nombre),e=>num(e.monto));
    o.pag=sum(es.filter(e=>e.tipo==='Pago peluquero'&&e.peluquero===p.nombre),e=>num(e.monto));
    o.saldo=o.ganado-o.adel-o.pag; return o;});
}

LIVE.semEstado=()=>{const d=S.semanas&&S.semanas[S.semana];if(!d)return '';
  return d.estado==='cerrada'?`<span class="chip ok">Semana cerrada por ${esc(nameOf(d.by))} el ${fmtD((d.ts||'').slice(0,10))}</span>`:d.estado==='abierta'&&d.reabiertaTs?`<span class="chip warn">Reabierta el ${fmtD(d.reabiertaTs.slice(0,10))}</span>`:''};
function datosSemana(W){
  const fin=addD(W,6),enSem=f=>f>=W&&f<=fin,prev=S.semanas&&S.semanas[addD(W,-7)];
  const liq=liquidacion(W);const sueldosOk=liq.every(o=>Math.abs(o.saldo)<1);
  const dias=[];for(let d=W;d<=fin;d=addD(d,1))dias.push(d);
  const conVentas=dias.filter(d=>S.ventas.some(v=>v.fecha===d));
  const faltan=conVentas.filter(d=>{const c=S.cierres.find(x=>x.fecha===d);return !(c&&c.contado!==null&&c.contado!==undefined&&c.contado!=='')});
  const vs=S.ventas.filter(v=>enSem(v.fecha)),es=S.egresos.filter(e=>enSem(e.fecha));
  const rows=C().cuentas.map(k=>{
    const pr=prev&&prev.saldos&&prev.saldos[k]&&prev.saldos[k].real!=null?num(prev.saldos[k].real):null;
    const iniIn=S.wkVals['ini_'+W+k];const ini=pr!==null?pr:num(iniIn);
    const cob=sum(vs.filter(v=>v.cuenta===k),v=>calc(v).entra);
    const ent=sum(es.filter(e=>e.tipo==='Movimiento entre cuentas'&&e.destino===k),e=>num(e.monto));
    const sal=sum(es.filter(e=>e.cuenta===k),e=>num(e.monto));
    const sis=ini+cob+ent-sal,realIn=S.wkVals['real_'+W+k]??'';
    const dif=realIn===''?null:num(realIn)-sis;
    return {k,pr,iniIn:iniIn??'',ini,cob,ent,sal,sis,realIn,dif}});
  const cuentasOk=rows.every(r=>r.dif!==null&&Math.abs(r.dif)<1);
  const sab=addD(W,5),terminada=today()>=sab;
  return {fin,sab,liq,sueldosOk,conVentas,faltan,rows,cuentasOk,terminada,ok:sueldosOk&&!faltan.length&&cuentasOk&&terminada};
}

  ${x.rows.map(r=>`<tr><td><b>${esc(r.k)}</b></td><td class="n">${r.pr!==null?money(r.pr):`<input type="number" step="100" data-wk="ini_${W}${esc(r.k)}" value="${esc(r.iniIn)}" placeholder="0" style="width:110px;text-align:right" aria-label="Saldo inicial ${esc(r.k)}">`}</td>

  <p class="note">${x.rows.some(r=>r.pr===null)?'Es el primer cierre: cargá con cuánto arrancó cada cuenta el lunes. De ahí en más se toma solo del cierre anterior. ':''}Si hay diferencia, falta cargar algún cobro o gasto, o se cargó en otra cuenta.</p>

function cajaDia(d){
  const ef=cajaEf();
  const cobros=sum(S.ventas.filter(v=>v.fecha===d&&v.cuenta===ef),v=>calc(v).entra);
  const entradas=sum(S.egresos.filter(e=>e.fecha===d&&e.tipo==='Movimiento entre cuentas'&&e.destino===ef),e=>num(e.monto));
  const salidas=sum(S.egresos.filter(e=>e.fecha===d&&e.cuenta===ef),e=>num(e.monto));
  const cie=S.cierres.find(c=>c.fecha===d);
  const prev=S.cierres.filter(c=>c.fecha<d&&c.contado!==null&&c.contado!==undefined&&c.contado!=='').pop();
  const inicial=cie&&cie.inicial!==null&&cie.inicial!==undefined&&cie.inicial!==''?num(cie.inicial):prev?num(prev.contado):0;
  return {ef,cobros,entradas,salidas,inicial,esperado:inicial+cobros+entradas-salidas,cie,prev};
}

/* ===================== eventos ===================== */
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('button');if(!b)return;
  if(b.dataset.tab){S.tab=b.dataset.tab;S.editVenta=S.editEgreso=null;if(S.tab!=='config')S.draft=null;render();window.scrollTo(0,0);return}
  const pick=b.closest('[data-pick]');
  if(pick&&b.classList.contains('pick')){pick.querySelectorAll('.pick').forEach(x=>x.classList.toggle('on',x===b));document.getElementById(pick.dataset.pick).value=b.dataset.val;if(pick.dataset.pick==='vPel'){if(isAdmin()){try{localStorage.setItem('nb_pel',b.dataset.val)}catch(e){}}}prevVenta();showByTipo();return}

  const arm=(txt)=>{if(b.dataset.armed){return true}b.dataset.armed='1';b.dataset.old=b.textContent;b.textContent=txt;b.classList.add('armed');setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=b.dataset.old;b.classList.remove('armed')}},4000);return false};
  switch(a){
    case 'logout': await signOut(auth);break;
    case 'recalcSem': live();break;
    case 'salirPreview': if(S.preview){S.role='admin';S.myPel=S.preview.myPel;S.preview=null;S.tab=null;render()} break;
    case 'cerrarSem': {const W=S.semana,x=datosSemana(W);if(!x.ok){toast('Todavía falta completar algo para cerrar');live();break}
      if(!arm('Confirmar cierre'))break;
      const saldos={};x.rows.forEach(r=>saldos[r.k]={inicial:r.ini,sistema:Math.round(r.sis),real:num(r.realIn)});
      const r=resumen();const d={lunes:W,estado:'cerrada',by:me(),ts:nowIso(),saldos,sueldos:sum(x.liq,o=>o.ganado)};
      if(await safe(put('semanas',W,d),'Semana cerrada'))logA('Cerró semana','semanas',W,'Semana del '+fmtD(W))} break;
    case 'reabrirSem': {if(S.role!=='admin')break;if(!arm('¿Reabrir?'))break;const W=S.semana,o=S.semanas[W];const d={...o,estado:'abierta',reabiertaBy:me(),reabiertaTs:nowIso()};delete d.id;
      if(await safe(put('semanas',W,d),'Semana reabierta'))logA('Reabrió semana','semanas',W,'Semana del '+fmtD(W))} break;
    case 'olvide': {const m=$('#lMail').value.trim();if(!m){$('#lMsg').textContent='Escribí tu mail arriba y tocá de nuevo.';break}
      try{await sendPasswordResetEmail(auth,m);$('#lMsg').textContent='Te mandamos un mail para cambiar la contraseña. Revisá también spam.'}catch(e){$('#lMsg').textContent='No se pudo mandar el mail. Revisá que esté bien escrito.'}} break;
    case 'resetPass': if(arm('¿Mandar mail?')){try{await sendPasswordResetEmail(auth,b.dataset.mail);toast('Mail enviado a '+b.dataset.mail)}catch(e){toast('No se pudo mandar el mail')}} break;
    case 'guardarRol': {const v=document.getElementById('r_'+b.dataset.id).value,u=S.usuarios.find(x=>x.id===b.dataset.id);
      const d={...u,rol:v.startsWith('pel:')?'peluquero':v,peluquero:v.startsWith('pel:')?v.slice(4):''};delete d.id;
      if(await safe(put('usuarios',u.id,d),'Rol guardado'))logA('Cambió rol','usuarios',u.id,(u.nombre||u.email)+' → '+(d.peluquero?'peluquero '+d.peluquero:d.rol))} break;
    case 'toggleActivo': if(arm('¿Seguro?')){const u=S.usuarios.find(x=>x.id===b.dataset.id);const d={...u,activo:u.activo===false};delete d.id;
      if(await safe(put('usuarios',u.id,d),d.activo?'Usuario activado':'Usuario desactivado'))logA(d.activo?'Activó usuario':'Desactivó usuario','usuarios',u.id,u.nombre||u.email)} break;
    case 'cfgDefault': if(await safe(put('config','main',DEFAULT_CFG),'Configuración creada'))logA('Creó configuración','config','main',''); break;
    case 'editVenta': S.editVenta=b.dataset.id;render();window.scrollTo(0,0);prevVenta();break;
    case 'cancelVenta': S.editVenta=null;render();break;
    case 'delVenta': if(arm('¿Borrar?')){const o=S.ventas.find(x=>x.id===b.dataset.id);if(o&&lockedV(o)){toast(lockMsg(o.fecha));break}if(await safe(del('ventas',b.dataset.id),'Venta borrada')&&o)logA('Borró venta','ventas',o.id,descV(o)+' ('+fmtD(o.fecha)+')')}break;
    case 'editEgreso': S.editEgreso=b.dataset.id;render();window.scrollTo(0,0);showByTipo();break;
    case 'cancelEgreso': S.editEgreso=null;render();showByTipo();break;
    case 'delEgreso': if(arm('¿Borrar?')){const o=S.egresos.find(x=>x.id===b.dataset.id);if(o&&lockedE(o)){toast(lockMsg(o.fecha));break}if(await safe(del('egresos',b.dataset.id),'Movimiento borrado')&&o)logA('Borró movimiento','egresos',o.id,descE(o)+' ('+fmtD(o.fecha)+')')}break;
    case 'delAbono': if(arm('¿Borrar?')){const o=S.abonos.find(x=>x.id===b.dataset.id);if(await safe(del('abonos',b.dataset.id),'Abono borrado')&&o)logA('Borró abono','abonos',o.id,o.cliente)}break;
    case 'semPrev': S.semana=addD(S.semana,-7);resubRange();render();break;
    case 'semNext': S.semana=addD(S.semana,7);resubRange();render();break;
    case 'semHoy': S.semana=monday(today());resubRange();render();break;
    case 'pagar': if(arm('Confirmar '+money(+b.dataset.monto))){const d={fecha:today(),tipo:'Pago peluquero',concepto:'',peluquero:b.dataset.pel,monto:+b.dataset.monto,cuenta:cajaEf(),destino:'',semana:S.semana,semanaRef:S.semana,nota:'Sueldo semana '+fmtD(S.semana),by:me(),ts:nowIso()};let id;if(await safe(add('egresos',d).then(x=>id=x),'Pago registrado'))logA('Registró pago','egresos',id,descE(d))}break;
    case 'addRow': readDraft();{const k=b.dataset.k,blank={peluqueros:{nombre:'',pct:.5},medios:{medio:'',pct:0,cuenta:S.draft.cuentas[0]||''},catalogo:{concepto:'',tipo:'Servicio',precio:0,base:null,costo:0,comisiona:true},cuentas:'',gastos:{concepto:''}}[k];S.draft[k].push(blank)}render();break;
    case 'rmRow': readDraft();S.draft[b.dataset.k].splice(+b.dataset.i,1);render();break;
    case 'resetDraft': S.draft=null;render();break;
    case 'saveCfg': {readDraft();const d=S.draft;
      for(const k of['peluqueros','catalogo','medios','gastos'])d[k]=d[k].filter(x=>x.nombre||x.concepto||x.medio);d.cuentas=d.cuentas.filter(Boolean);
      if(!d.peluqueros.find(p=>p.nombre===d.dueno))d.dueno=(d.peluqueros[0]||{}).nombre||'';
      if(await safe(put('config','main',JSON.parse(JSON.stringify(d))),'Configuración guardada')){logA('Cambió configuración','config','main','');S.draft=null;render()}} break;
  }
});
document.addEventListener('input',ev=>{if(ev.target.dataset&&ev.target.dataset.wk!==undefined){S.wkVals[ev.target.dataset.wk]=ev.target.value;return}if(ev.target.closest('#fVenta'))prevVenta();if(ev.target.closest('#fEgreso'))prevEgreso()});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='verComo'){const v=t.value;
    if(!v){if(S.preview){S.role='admin';S.myPel=S.preview.myPel;S.preview=null}}
    else{if(!S.preview)S.preview={real:'admin',myPel:S.myPel};S.role=v==='dueno'?'dueno':'peluquero';S.myPel=v.startsWith('pel:')?v.slice(4):''}
    S.tab=null;S.editVenta=S.editEgreso=null;S.draft=null;render();window.scrollTo(0,0);return}
  if(t.dataset&&t.dataset.wk!==undefined){S.wkVals[t.dataset.wk]=t.value;live();return}
  if(t.id==='mesSel'&&t.value){S.mes=t.value;resubRange();resubSaldos();render()}
  else if(t.id==='fPel'){S.filtroPel=t.value;live()}
  else if(t.id==='cFecha'&&t.value){S.cajaFecha=t.value;resubRange();live()}
  else if(t.closest('#fVenta'))prevVenta();
});
document.addEventListener('submit',async ev=>{
  ev.preventDefault();const f=ev.target;
  if(f.id==='fLogin'){$('#lMsg').textContent='Entrando…';
    try{await signInWithEmailAndPassword(auth,$('#lMail').value.trim(),$('#lPass').value)}catch(e){$('#lMsg').textContent=e.code==='auth/too-many-requests'?'Demasiados intentos. Esperá unos minutos.':'Mail o contraseña incorrectos.'}
    return}
  if(f.id==='fUser'){const nom=$('#uNom').value.trim(),mail=$('#uMail').value.trim().toLowerCase(),pass=$('#uPass').value,v=$('#uRol').value;
    if(pass.length<6){toast('La contraseña tiene que tener al menos 6 caracteres');return}
    const sec=initializeApp(firebaseConfig,'alta'+Date.now());const sa=getAuth(sec);
    try{const cr=await createUserWithEmailAndPassword(sa,mail,pass);const uid=cr.user.uid;await signOut(sa);
      const d={nombre:nom,email:mail,rol:v.startsWith('pel:')?'peluquero':v,peluquero:v.startsWith('pel:')?v.slice(4):'',activo:true,by:me(),ts:nowIso()};
      if(await safe(put('usuarios',uid,d),'Usuario creado. Pasale el mail y la contraseña a '+nom)){setDoc(doc(fdb,'nombres',uid),{nombre:nom}).catch(()=>{});logA('Creó usuario','usuarios',uid,nom+' · '+mail+' · '+(d.peluquero?'peluquero '+d.peluquero:d.rol));f.reset()}
    }catch(e){toast(e.code==='auth/email-already-in-use'?'Ese mail ya tiene usuario.':e.code==='auth/invalid-email'?'El mail no es válido.':e.code==='auth/weak-password'?'Contraseña muy débil.':'No se pudo crear el usuario.')}
    return}
  if(f.id==='fVenta'){const v=readVenta();
    if(!v.fecha||!v.peluquero||!v.concepto||!v.medio){toast('Completá peluquero, servicio y medio de pago');return}
    const doc=snap(v),old=S.editVenta?S.ventas.find(x=>x.id===S.editVenta):null;
    if(semCerrada(monday(v.fecha))||(old&&lockedV(old))){toast(lockMsg(old?old.fecha:v.fecha));return}
    if(old){doc.by=old.by||'';doc.ts=old.ts||'';doc.editBy=me();doc.editTs=nowIso()}else{doc.by=me();doc.ts=nowIso()}
    $('#vBtn').disabled=true;
    if(old){if(await safe(put('ventas',old.id,doc),'Venta actualizada')){logA('Editó venta','ventas',old.id,descV(doc));S.editVenta=null;render()}else prevVenta()}
    else{let id;if(await safe(add('ventas',doc).then(x=>id=x))){
      logA('Cargó venta','ventas',id,descV(doc));render();
      toast('Guardado: '+doc.concepto+' · '+doc.peluquero+' · '+money(calc(doc).total+calc(doc).prop),'Deshacer',async()=>{if(await safe(del('ventas',id),'Venta deshecha'))logA('Deshizo venta','ventas',id,descV(doc))});
    }else prevVenta()}}
  else if(f.id==='fEgreso'){const tipo=$('#eTipo').value,fecha=$('#eFecha').value,monto=num($('#eMonto').value);
    const doc={fecha,tipo,monto,cuenta:$('#eCuenta').value,concepto:tipo==='Gasto'?$('#eConcepto').value:'',
      peluquero:['Adelanto','Pago peluquero'].includes(tipo)?$('#ePel').value:'',destino:tipo==='Movimiento entre cuentas'?$('#eDest').value:'',
      semanaRef:['Adelanto','Pago peluquero'].includes(tipo)?$('#eSem').value:'',nota:$('#eNota').value.trim()};
    doc.semana=monday(doc.semanaRef||fecha);doc.semanaFecha=monday(fecha);
    if(!fecha||!monto){toast('Completá fecha y monto');return}
    if(!tiposE().includes(tipo)){toast('No tenés permiso para cargar ese tipo de movimiento');return}
    if(tipo==='Gasto'&&!doc.concepto){toast('Elegí el concepto del gasto');return}
    if(['Adelanto','Pago peluquero'].includes(tipo)&&!doc.peluquero){toast('Elegí el peluquero');return}
    if(tipo==='Movimiento entre cuentas'&&doc.destino===doc.cuenta){toast('La cuenta de destino tiene que ser otra');return}
    const old=S.editEgreso?S.egresos.find(x=>x.id===S.editEgreso):null;
    if(lockedE(doc)||(old&&lockedE(old))){toast(lockMsg(fecha));return}
    if(old){doc.by=old.by||'';doc.ts=old.ts||'';doc.editBy=me();doc.editTs=nowIso()}else{doc.by=me();doc.ts=nowIso()}
    $('#eBtn').disabled=true;S.egDefault={tipo};
    if(old){if(await safe(put('egresos',old.id,doc),'Movimiento actualizado')){logA('Editó movimiento','egresos',old.id,descE(doc));S.editEgreso=null;render()}else prevEgreso()}
    else{let id;if(await safe(add('egresos',doc).then(x=>id=x))){logA('Cargó movimiento','egresos',id,descE(doc));render();
      toast('Guardado: '+tipo+' '+money(monto),'Deshacer',async()=>{if(await safe(del('egresos',id),'Movimiento deshecho'))logA('Deshizo movimiento','egresos',id,descE(doc))});
    }else prevEgreso()}}
  else if(f.id==='fCaja'){const d=S.cajaFecha,ini=$('#cIni').value;
    if(semCerrada(monday(d))){toast(lockMsg(d));return}
    const doc={semana:monday(d),fecha:d,contado:num($('#cCont').value),inicial:ini===''?null:num(ini),quien:$('#cQuien').value,nota:$('#cNota').value.trim(),by:me(),ts:nowIso()};
    if(await safe(put('cierres',d,doc),'Cierre guardado'))logA('Cerró caja','cierres',d,fmtD(d)+' · contado '+money(doc.contado))}
  else if(f.id==='fCuentas'){const ini={},real={};C().cuentas.forEach((k,i)=>{const a=$('#ci'+i).value,b=$('#cr'+i).value;if(a!=='')ini[k]=num(a);if(b!=='')real[k]=num(b)});
    if(await safe(put('saldos',S.mes,{mes:S.mes,inicial:ini,real,by:me(),ts:nowIso()}),'Saldos guardados'))logA('Cargó saldos','saldos',S.mes,mesLabel(S.mes))}
  else if(f.id==='fAbono'){const doc={cliente:$('#aCli').value.trim(),tel:$('#aTel').value.trim(),fechaPago:$('#aFecha').value,cortes:num($('#aCortes').value)||4};
    if(!doc.cliente){toast('Poné el nombre del cliente');return}
    if(semCerrada(monday(doc.fechaPago))){toast(lockMsg(doc.fechaPago));return}
    doc.semana=monday(doc.fechaPago);doc.by=me();doc.ts=nowIso();let id;if(await safe(add('abonos',doc).then(x=>id=x),'Abono agregado')){logA('Agregó abono','abonos',id,doc.cliente);f.reset()}}
});

/* ===================== arranque ===================== */
let meUnsub=null;
onAuthStateChanged(auth,u=>{
  if(meUnsub){meUnsub();meUnsub=null}stopAll();
  S.preview=null;S.cfg=null;S.cfgLoaded=false;S.role=null;S.tab=null;S.draft=null;S.usuarios=[];S.log=[];
  if(!u){S.uid=null;S.email='';S.role='login';render();return}
  S.uid=u.uid;S.email=u.email||'';S.role='cargando';render();
  let creating=false;
  meUnsub=onSnapshot(doc(fdb,'usuarios',u.uid),async d=>{
    let m=d.exists()?d.data():null;
    if(!m&&(u.email||'').toLowerCase()===ADMIN_EMAIL){if(!creating){creating=true;try{await setDoc(doc(fdb,'usuarios',u.uid),{nombre:'Isaías',email:u.email,rol:'admin',peluquero:'',activo:true,ts:nowIso()})}catch(e){console.warn(e);toast('No se pudo crear tu usuario de administrador. Revisá las reglas de Firestore.')}}return}
    if(S.preview)return;
    const prev=S.role+'|'+S.myPel;
    if(!m||m.activo===false)S.role='inactivo';else{S.role=m.rol;S.myPel=m.peluquero||''}
    if(S.role+'|'+S.myPel!==prev){if(S.role==='inactivo'){stopAll();render()}else startData()}
  },e=>{console.warn(e);S.role='inactivo';render()});
});
</script>
